spring.application.name=car-sharing-app

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_DOCKER_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}

telegram.bot.enabled=true
telegram.bot.name=${TELEGRAM_BOT_NAME}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.admin.chat.id=${TELEGRAM_ADMIN_CHAT_ID}

databaseChangeLog:
  - changeSet:
      id: create-payments-table
      author: anastasiiakulinich
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: rental_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payments_rentals
                    referencedTableName: rentals
                    referencedColumnNames: id
              - column:
                  name: session_url
                  type: varchar(510)
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: amount_to_pay
                  type: decimal
                  constraints:
                    nullable: false